<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM 01</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Que es defer: le dice al navegador que espere a que se cargue el HTML antes
    de ejecutar el script, para que no se rompa el código si el script hace
    referencia a elementos del DOM que aún no existen. -->
    <script src="app.js" defer></script>
  </head>
  <body>
    <h1 id="tienda">GuiSumak</h1>
    <p class="lema">Practicas con Js</p>
    <ul>
      <li class="prenda">poncho</li>
      <li class="prenda">anaco</li>
      <li class="prenda">sacos</li>
    </ul>
  </body>
</html>
